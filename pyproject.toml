[build-system]
# Upper bounds are deliberate: an unbounded requirement lets a future major
# release of the build backend or a dev tool change behaviour on an unrelated
# `pip install`. Raise these consciously.
requires = ["setuptools>=64,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "apple-photos-cleaner"
version = "1.4.0"
description = "Analyze, audit, and clean up your Apple Photos library via its SQLite database"
requires-python = ">=3.10"
license = "MIT"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<10",
    "pytest-cov>=4.0.0,<8",
    "ruff>=0.4.0,<1",
    "mypy>=1.8.0,<3",
]

# Primarily a Claude skill: SKILL.md runs scripts/ by path, and tests import them via pytest's
# `pythonpath`. `pipx install .` additionally provides the `photos-cleaner` command (T1.6):
# - photos_cleaner (repo root) is the dispatcher;
# - scripts/ installs as the private package `photos_cleaner_commands`, which the dispatcher puts on
#   sys.path itself, so the scripts' top-level names (_common, doctor, ...) never land in site-packages.
#
# Keep this explicit: with no [tool.setuptools] section, auto-discovery once installed references/
# (markdown docs) as a top-level `references` package and shipped none of the scripts.
[project.scripts]
photos-cleaner = "photos_cleaner:main"

[tool.setuptools]
py-modules = ["photos_cleaner"]
packages = ["photos_cleaner_commands"]
package-dir = { "photos_cleaner_commands" = "scripts" }

[tool.setuptools.package-data]
photos_cleaner_commands = ["schema-fingerprints.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line too long (let formatter handle)
    "SIM108", # ternary operator (readability preference)
    "B028",   # stacklevel in warnings
    "UP015",  # open mode redundancy
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]  # allow fixture redefinition

[tool.ruff.lint.isort]
known-first-party = ["_bootstrap", "_common", "_scenes", "_schema"]

[tool.coverage.report]
# Ratchet, not a target — the suite sits around 95%. Raise this when it climbs (T0.14).
fail_under = 92

[tool.mypy]
# No `python_version` pin: the type results are interpreter-independent, and
# Ruff's `target-version` (with the UP rules enabled) is what actually guards
# compatibility with the `requires-python` floor.
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
files = ["scripts/*.py", "photos_cleaner.py"]
