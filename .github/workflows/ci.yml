name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        # Floor + latest two (see CONTRIBUTING.md "Python version policy")
        python-version: ["3.10", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=scripts --cov-report=term-missing

      - name: Check formatting
        run: ruff format --check .

  # Separate job: the type results are interpreter-independent, so there is
  # nothing to gain from a matrix here.
  typecheck:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Type check with mypy
        run: mypy
