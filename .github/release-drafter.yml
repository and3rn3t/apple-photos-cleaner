# The version comes from SKILL.md (RELEASING.md), not from PR labels: a "fix" PR that adds a JSON
# field is a minor release, which labels can't express. So the draft doesn't guess a version or
# tag. Publishing the release sets both (RELEASING.md step 8).
name-template: 'Next release (draft)'

categories:
  - title: '🚀 Features'
    labels: ['feature', 'enhancement']
  - title: '🐛 Bug Fixes'
    labels: ['fix', 'bugfix', 'bug']
  - title: '🔒 Security'
    labels: ['security']
  - title: '🧰 Maintenance'
    labels: ['chore', 'dependencies', 'ci']
  - title: '📝 Documentation'
    labels: ['documentation', 'docs']

template: |
  ## What's Changed

  $CHANGES
